<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQLite 数据库查看器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 视图切换按钮 -->
        <div class="view-toggle">
            <label class="toggle-btn">
                <input type="radio" name="viewMode" value="table" checked> 📋 表格视图
            </label>
            <label class="toggle-btn">
                <input type="radio" name="viewMode" value="chart"> 📈 曲线视图
            </label>
        </div>

        <!-- iframe 容器 -->
        <iframe id="viewFrame" src="TableView/table.html" frameborder="0"></iframe>
    </div>

    <script src="script.js"></script>
</body>
</html>
